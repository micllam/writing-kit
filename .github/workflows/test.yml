name: Test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_call:
    inputs:
      package-ref:
        description: The Git ref that the rules of the package link to
        type: string
        default: master

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PACKAGE_REF: ${{ inputs.package-ref || 'master' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.x"
            os: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install Vale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VALE_VERSION=$(jq -r .vale_version meta.json | sed 's/^>=//')
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          gh release download "v${VALE_VERSION}" \
            --repo vale-cli/vale \
            --pattern "$archive" \
            --pattern "vale_${VALE_VERSION}_checksums.txt" \
            --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum --check --ignore-missing "vale_${VALE_VERSION}_checksums.txt"
          tar -xzf "$archive" vale
          sudo install vale /usr/local/bin/vale

      - name: Build the package
        run: ./scripts/package.py dist/Micllam.zip

      - name: Run the tests
        env:
          PACKAGE_ZIP: dist/Micllam.zip
        run: python3 -m unittest

      - name: Upload the package
        if: matrix.python == '3.x'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Micllam
          path: dist/Micllam.zip
          if-no-files-found: error
