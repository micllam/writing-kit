name: Test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.x"
            os: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install Vale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VALE_VERSION=$(jq -r .vale_version meta.json | sed 's/^>=//')
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          gh release download "v${VALE_VERSION}" \
            --repo vale-cli/vale \
            --pattern "$archive" \
            --pattern "vale_${VALE_VERSION}_checksums.txt" \
            --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum --check --ignore-missing "vale_${VALE_VERSION}_checksums.txt"
          tar -xzf "$archive" vale
          sudo install vale /usr/local/bin/vale

      - name: Run the tests
        run: python3 -m unittest
