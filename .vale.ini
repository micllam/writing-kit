StylesPath = styles
MinAlertLevel = suggestion

[formats]
COMMIT_*.txt = md
rs = md

[*.{md,txt,rs}]
BasedOnStyles = Micllam
Micllam.WrapMarkdown = NO
Micllam.WrapComments = NO
Micllam.TitleComments = NO
Micllam.ChangelogList = NO
Micllam.SectionDividers = NO
Micllam.CommitSubject = NO
Micllam.CommitWrap = NO

[*.md]
Micllam.WrapMarkdown = YES

[{CHANGELOG.md,**/CHANGELOG.md}]
Micllam.ChangelogList = YES

[{COMMIT_*.txt,**/COMMIT_*.txt}]
Micllam.CommitSubject = YES
Micllam.CommitWrap = YES

[*.rs]
Micllam.WrapComments = YES
Micllam.SectionDividers = YES
Micllam.TitleComments = YES

[*.{sh,toml,py}]
Micllam.WrapComments = YES
Micllam.SectionDividers = YES
