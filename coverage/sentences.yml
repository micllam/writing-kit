# Sentences

sentence-length: false
paragraph-length: false
simple-tenses: true # PresentPerfect.yml
active-voice: false
no-reader-address: true # ReaderAddress.yml
no-action-verb-for-a-setting: false
verb-over-copula: false
no-classifying-predicate: true # ClassifyingPredicate.yml
modals: true # Modals.yml, also a counterfactual "would"
requirement-with-must: false
rejected-design: false
no-ing-clause-after-a-comma: true # IngClause.yml
condition-first: false
complete-grammar: true # Contractions.yml
no-pronoun-for-a-type: true # PronounOne.yml
no-cleft: true # Cleft.yml
no-possessive-predicate: true # PossessivePredicate.yml
no-caller-consequence: true # CallerConsequence.yml
plain-negation: true # PlainNegation.yml
no-contrast: true # Contrast.yml, also a terse contrast
