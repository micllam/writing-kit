extends: substitution
message: '''%s'' for ''%s'''
level: error
link: https://github.com/micllam/writing-kit/blob/master/docs/writing-style.md#vocabulary
ignorecase: true
swap:
  '(holds|supplies|carr(y|ies|ied)|rides? in)': 'contains, includes, is stored in, or name the field'
  'shapes?': 'pattern, form, model, variant'
  'land(s|ed)? (on|in)': 'is written to, is recorded against'
  '(write|writes|wrote|writing|read|reads|reading) (the|a|its|each|that) store': 'writes to the store, reads from the store'
  '(write|writes|wrote|written|writing) within': 'writes to'
  'govern(s|ed|ing)?': 'enables, determines, or name the control'
  'walks?': 'reads sequentially, traverses'
  'gat(ed|es|ing) on': 'hold until, waits for, conditional on'
  'since': 'because'
  'however': 'but'
  '((?<!will )need|needs|needed|have|has|had) to': 'an imperative, "it is necessary to" or "will need to"'
  '(out from under|when in doubt)': 'state the literal effect or condition'
  'driv(e|es|en|ing)': 'runs, advances, sends, or state the action'
  'dies with': 'terminates when'
  '(wiped|cleans)': 'removes'
  'hand-rolled': 'in-house, custom'
  'st(and|ands|ood) up': 'deploy'
  '(hands?|handed|handing)( \S+){0,2} (to|out)|hand-over': 'assigns to, assignment, or name the claim'
  'mint(s|ed|ing)?': 'constructs, creates, builds, or name the constructor'
  '((read|written) under|under (one|its|the|a|an|that|this|each|every|any|another)?( [a-z-]+)? ?(key|keys|prefix|tag))': 'at, with, within, or name the key'
  'serv(e|es|ed|ing)': 'is for, is used for, accepts calls, or state the purpose'
  'leaves with': 'is removed with'
  'harmless': 'state the literal effect'
  '(bookkeeping|housekeeping)': 'name the operations, or "the work that follows the commit"'
  '(?<!\blag(s|ging)?\s)behind': 'before, after, sorts before, sorts after, due after, is enabled by, requires, conditional on'
  'ahead of': 'before, after, due after'
  'prove[dsn]?': 'establishes, records, or state the observation'
  '(finds?|found|yields?) nothing': 'ended without a key, returned an empty page'
  'dead (configuration|code|value|field|arm|branch)': 'unreachable, unused, without effect, or state what it does not apply to'
  '(cheap|expensive)': 'state the literal cost as a count of reads, writes, scans or lock acquisitions'
  'hot paths?': 'name the path'
  'load[- ]bearing': 'necessary, or state what depends on it'
  'for free': 'by construction'
  'bolted[- ]on': 'separately maintained'
  'is noise': 'is negligible'
  'earns? its (keep|place)': 'is justified'
  'dedupe[sd]?': 'deduplicate'
  '(plumbing|machinery)': 'mechanism, or name the components'
  'impls': 'implementations'
  '(?<![-\w])pick(s|ed|ing)?(?! up\b)': 'choose'
  'handy': 'suitable'
  'tells you': 'states'
  'boasts?': 'has'
  '(nam(es?|ing) (the|a|an|its|one|every|each|that|this|whatever)|(it|that|which) names)': 'includes, specifies, identifies, refers to, or state the field'
  'echo(es|ed|ing)?': 'repeats, copies, includes'
  '((re-)?arm(s|ed|ing)?( only| itself| a| an| the| its| one| every| each| new)? (timer|timers|deadline|deadlines|lease|retry|promise|promises)|armed (for|at)|re-arms?|deadlines armed)': 'schedules, sets, or state the deadline'
  'whatever': 'any, every, or state the set'
  'answer(s|ed|ing)?': 'returns, reports, replies with, or state the response'
  'verdicts?': 'outcome, result, failure, or state what was decided'
  '(pin(s|ning)?|pinned (hash|definition|version))': 'records, fixed at, or state the field'
  '(?<=\*\s)takes (it|them)': 'state the parameter, as in "the key order of a `kv_scan` listing"'
  'stamp(s|ed|ing)?': 'is recorded at, is dated, sets, writes'
  'stands? in for': 'is used in place of, or state which one is kept'
  'at the same': 'a sentence that states the field is unchanged'
  'born': 'created in state X'
  'births?': 'creates'
  '(off|out of) (a|the|its|each|one|every) [a-z]* ?(key|record|header|name|prefix)': 'parses X from, extracts X from, removes X from'
  'key(s|ed) (by|on)': 'uses X as its key'
  'fits': 'is right when, is the correct choice, applies when'
  '(is|are|was|were) over(?=$|[.,:;)]| (and|but|when|once|by|after|before|until))': 'ended, complete, finished'
  '(leave|leaves|left|leaving) ([a-z`_]+ ){0,3}behind': 'stored, held, or name what remains and where'
  'surviv(e|es|ed|ing)': 'persists across, remains after, compiles after, stands, stays'
  '(locking tests?|tests? (that )?locks?|lock(s|ed)? (it|them|the contract|the rule|each contract|that contract))': 'tests, checks, asserts, the test of the contract'
  'step(s|ped|ping)? over': 'skips'
  '(run|runs|ran|running|go|goes|went|going) past': 'exceeds, with the measured quantity as the subject'
  '(left|leaves?|leaving) out': 'omitted, omits, or state the condition'
  'beside': 'separate from, together with, contains, or name the relation'
  '(run|runs|ran|running|works?|operates?) next to': 'alongside'
  '(the|its|their) one (writer|reader|owner)s?': 'the only writer'
  'makes? sense when': 'are warranted when'
  'address(es)? the issue': 'corrects the fault'
  'cliffs?': 'sharp degradation'
  'flat out': 'as fast as possible'
  'knobs?': 'parameter'
  '((cold|warm) (cache|start)s?|caches? (is|are|was|were) (cold|warm))': 'state the literal property'
  'bags?': 'collection'
  'nobody': 'no task'
  'stampedes?': 'contend on'
  '(sweet spot|home ground)': 'strongest fit'
  '(leverag(e|es|ed|ing)|utili[sz](e|es|ed|ing))': 'use'
  'in order to': 'to'
  'prior to': 'before'
  'ensur(e|es|ed|ing)': 'make sure that'
  'facilitat(e|es|ed|ing)': 'help, make possible'
  'enhanc(e|es|ed|ing)': 'improve'
  'functionality': 'function, feature'
  'enables you to': 'lets a caller'
  'streamlin(e|es|ed|ing)': 'make simpler'
  '(delve|delves|dive|dives) into': 'read, examine'
  'out of the box': 'by default'
  'under the hood': 'internally'
  '(crucial|pivotal|paramount)': 'important'
  'showcas(e|es|ed|ing)': 'show'
  '(foster|empower|bolster)(s|ed|ing)?': 'help, support, let'
  '(furthermore|moreover)': 'also'
  'meticulous(ly)?': 'careful'
  'holistic': 'full'
  'paradigms?': 'model'
  'intricate': 'complex'
  '(gracefully handles?|blazingly fast)': 'state what it does, or give the number'
